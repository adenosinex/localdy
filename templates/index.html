<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>短视频浏览项目</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vant@4/lib/index.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{% raw %}
<div id="app">
    <div class="main-video" @touchstart="handleTouchStart" @touchend="handleTouchEnd">
        <!-- 搜索按钮 -->
        <div style="position:absolute;top:18px;right:18px;z-index:10;">
            <van-button type="primary" icon="search" size="small" @click="showSearch = true">搜索</van-button>
        </div>
        <div class="video-box" v-if="state.videos.length">
            <div class="video-title" @click="toggleDetail">{{ currentVideo.filename }}</div>
            <video
                :src="getVideoUrl(currentVideo.id)"
                controls
                autoplay
                :key="currentVideo.id"
                @ended="nextVideo"
            ></video>
            <div class="video-actions">
                <van-button type="primary" size="small" @click="prevVideo" :disabled="currentIndex===0">上一个</van-button>
                <van-button type="primary" size="small" @click="nextVideo" :disabled="currentIndex===state.videos.length-1">下一个</van-button>
            </div>
            <van-popup v-model:show="showDetail" position="bottom" round>
                <div style="padding:20px;">
                    <h4>视频详情</h4>
                    <p>文件名: {{ currentVideo.filename }}</p>
                    <p>标签: {{ currentVideo.tags }}</p>
                    <p>评分: 
                        <van-rate v-model="currentVideo.score" @change="updateScore" />
                    </p>
                    <p>分类: {{ currentVideo.detail }}</p>
                    <van-button type="primary" block :url="getVideoUrl(currentVideo.id)" download>下载</van-button>
                </div>
            </van-popup>
        </div>
        <div v-else style="color:#fff;margin-top:40px;">暂无视频</div>
        <!-- 搜索弹窗 -->
        <van-popup v-model:show="showSearch" position="top" round style="width:90vw;">
            <div style="padding:20px;">
                <h4>搜索与筛选</h4>
                <van-field v-model="searchKeyword" label="关键词" placeholder="输入关键词" />
                <div style="margin:10px 0;">
                    <span>评分筛选：</span>
                    <van-rate v-model="searchScore" />
                </div>
                <van-button type="primary" block @click="doSearch">确认搜索</van-button>
            </div>
        </van-popup>
    </div>
</div>
{% endraw %}
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
<script src="/static/js/main.js" type="module"></script>
</body>
</html>
